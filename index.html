<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pushpika | Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --black: #000000;
            --deep-black: #050505;
            --card-bg: #111111;
            --border: #1e1e1e;
            --border-light: #2a2a2a;
            --white: #ffffff;
            --off-white: #e0e0e0;
            --gray: #888888;
            --gray-light: #aaaaaa;
            --electric-blue: #0066ff;
            --electric-blue-light: #3388ff;
            --gradient-blue: linear-gradient(135deg, #0066ff, #00aaff);
            --shadow-blue: 0 0 30px rgba(0, 102, 255, 0.3);
            --transition: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--black);
            color: var(--white);
            line-height: 1.6;
        }
        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.03;
            background-image: radial-gradient(circle, #ffffff 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Navbar */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            padding: 1rem 2rem; background: rgba(0,0,0,0.9);
            border-bottom: 1px solid var(--border);
        }
        .navbar-inner {
            max-width: 1300px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem;
            font-weight: 700; color: var(--white); text-decoration: none;
        }
        .nav-logo span { color: var(--electric-blue); }
        .nav-links { display: flex; list-style: none; gap: 1.5rem; flex-wrap: wrap; }
        .nav-links a {
            color: var(--off-white); text-decoration: none; font-size: 0.9rem;
        }
        .nav-cta {
            background: var(--electric-blue); color: #fff !important;
            padding: 0.5rem 1.2rem !important; border-radius: 50px;
        }

        /* Hero */
        .hero {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 6rem 2rem 2rem; text-align: center;
        }
        .hero-title {
            font-family: 'Poppins', sans-serif; font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 800; margin-bottom: 1rem;
        }
        .hero-title .highlight {
            background: var(--gradient-blue); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }
        .hero-subtitle { color: var(--gray); margin-bottom: 2rem; }
        .btn {
            padding: 0.8rem 2rem; border-radius: 50px; font-weight: 600;
            cursor: pointer; border: none; display: inline-flex; align-items: center;
            gap: 8px; text-decoration: none; color: #fff; margin: 0.5rem;
        }
        .btn-primary { background: var(--electric-blue); }
        .btn-outline { background: transparent; border: 2px solid var(--border-light); }

        section { padding: 4rem 2rem; }
        .section-container { max-width: 1200px; margin: 0 auto; }
        .section-title {
            font-family: 'Poppins', sans-serif; font-size: 2.5rem;
            font-weight: 700; margin-bottom: 2rem; text-align: center;
        }
        .section-title .accent { color: var(--electric-blue-light); }

        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; }
        .about-image-wrapper img { width: 100%; border-radius: 20px; }
        .about-image-placeholder {
            width: 100%; aspect-ratio: 1; border-radius: 20px; background: var(--card-bg);
            display: flex; align-items: center; justify-content: center; font-size: 5rem;
            color: var(--electric-blue);
        }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .project-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
        }
        .project-card img, .project-card video { width: 100%; height: 200px; object-fit: cover; }
        .project-card-body { padding: 1.5rem; }
        .project-card-tag {
            display: inline-block; padding: 0.3rem 0.8rem; border-radius: 50px;
            background: rgba(0,102,255,0.15); color: var(--electric-blue-light);
            font-size: 0.75rem; margin-bottom: 0.5rem;
        }

        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .photo-item { border-radius: 12px; overflow: hidden; cursor: pointer; }
        .photo-item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }

        .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        .skill-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 2rem 1rem; text-align: center;
        }
        .skill-icon { font-size: 2.5rem; color: var(--electric-blue-light); margin-bottom: 0.5rem; }

        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .contact-form input, .contact-form textarea {
            width: 100%; padding: 1rem; background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 12px;
            color: var(--white); margin-bottom: 1rem;
        }

        footer {
            text-align: center; padding: 3rem 2rem; border-top: 1px solid var(--border);
        }
        .footer-social a {
            width: 44px; height: 44px; border-radius: 50%; background: var(--card-bg);
            border: 1px solid var(--border); display: inline-flex; align-items: center;
            justify-content: center; color: var(--gray-light); margin: 0 0.5rem;
            text-decoration: none;
        }
        .footer-admin-link {
            color: #333; font-size: 0.7rem; cursor: pointer;
            display: inline-block; margin-top: 1rem;
        }

        /* Admin Panel */
        .admin-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .admin-overlay.active { opacity: 1; pointer-events: all; }
        .admin-panel {
            background: #111; border: 1px solid #2a2a2a; border-radius: 20px;
            padding: 2rem; width: 95%; max-width: 900px; max-height: 90vh;
            overflow-y: auto; position: relative; color: #fff;
        }
        .admin-close {
            position: absolute; top: 1rem; right: 1rem; font-size: 1.5rem;
            cursor: pointer; color: #aaa; background: none; border: none;
        }
        .admin-card {
            background: #0a0a0a; border: 1px solid #1e1e1e;
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem;
        }
        .admin-card h3 { margin-bottom: 1rem; color: var(--electric-blue-light); }
        .admin-card input, .admin-card textarea, .admin-card select {
            width: 100%; padding: 0.7rem; background: #111; border: 1px solid #2a2a2a;
            border-radius: 8px; color: #fff; margin-bottom: 0.5rem;
        }
        .admin-card label { display: block; margin-bottom: 0.3rem; color: #ccc; font-size: 0.9rem; }
        .btn-sm {
            padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem;
            background: var(--electric-blue); color: #fff; border: none; cursor: pointer;
        }
        .delete-btn {
            background: transparent; border: 1px solid #f44; color: #f44;
            border-radius: 50px; padding: 0.2rem 0.8rem; cursor: pointer; font-size: 0.75rem;
        }
        .admin-list { list-style: none; }
        .admin-list li {
            display: flex; justify-content: space-between; padding: 0.5rem 0;
            border-bottom: 1px solid #1a1a1a; align-items: center;
        }

        @media (max-width: 768px) {
            .about-grid, .contact-grid { grid-template-columns: 1fr; }
            .nav-links { gap: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="#home" class="nav-logo">Push<span>pika</span></a>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#software">Software</a></li>
                <li><a href="#iot">IOT</a></li>
                <li><a href="#photography">Photos</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact" class="nav-cta">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero" id="home">
        <div id="heroContent"></div>
    </section>

    <!-- About -->
    <section id="about"><div class="section-container about-grid" id="aboutContainer"></div></section>

    <!-- Software -->
    <section id="software">
        <div class="section-container">
            <h2 class="section-title">Software & <span class="accent">Web Sites</span></h2>
            <div class="projects-grid" id="softwareGrid"></div>
        </div>
    </section>

    <!-- IOT -->
    <section id="iot">
        <div class="section-container">
            <h2 class="section-title">IOT & <span class="accent">Robotics</span></h2>
            <div class="projects-grid" id="iotGrid"></div>
        </div>
    </section>

    <!-- Photography -->
    <section id="photography">
        <div class="section-container">
            <h2 class="section-title">Captured <span class="accent">Moments</span></h2>
            <div class="photo-grid" id="photoGrid"></div>
        </div>
    </section>

    <!-- Skills -->
    <section id="skills">
        <div class="section-container">
            <h2 class="section-title">Skills & <span class="accent">Talents</span></h2>
            <div class="skills-grid" id="skillsGrid"></div>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact"><div class="section-container contact-grid" id="contactContainer"></div></section>

    <!-- Footer -->
    <footer>
        <div class="footer-social" id="footerSocial"></div>
        <p>&copy; <span id="footerYear"></span> Pushpika</p>
        <span class="footer-admin-link" id="adminTrigger">● Admin Panel (Click Here)</span>
    </footer>

    <!-- Admin Overlay -->
    <div class="admin-overlay" id="adminOverlay">
        <div class="admin-panel" id="adminPanel"></div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9998;align-items:center;justify-content:center;">
        <span style="position:absolute;top:2rem;right:2rem;font-size:2rem;color:#fff;cursor:pointer;" id="lightboxClose">&times;</span>
        <img src="" id="lightboxImg" style="max-width:90vw;max-height:80vh;">
    </div>

    <script>
        // ========== DATA ==========
        let personal = { name:"Pushpika", heroBadge:"Creative Developer", heroSubtitle:"Building digital experiences.", aboutText1:"Hey! I'm Pushpika.", aboutText2:"I love tech and photography.", aboutImage:"", email:"pushpika@example.com", location:"Worldwide", availability:"Freelance", contactFormAction:"https://formspree.io/f/your-form-id", github:"#", discord:"#", instagram:"#", linkedin:"#" };
        let skills = [ {icon:"fas fa-code",name:"Web Dev"}, {icon:"fas fa-robot",name:"Robotics"}, {icon:"fas fa-camera",name:"Photography"} ];
        let software = [ {title:"Web App",media:"https://picsum.photos/seed/s1/600/400",type:"image",tag:"Web",desc:"A cool web app."} ];
        let iot = [ {title:"Robot Arm",media:"https://picsum.photos/seed/i1/600/400",type:"image",tag:"Robotics",desc:"6-DOF arm."} ];
        let photos = [ {url:"https://picsum.photos/seed/p1/800/600",caption:"Sunset"} ];
        let customSections = [];

        // Load from localStorage if exists
        try {
            if(localStorage.getItem('p_personal')) personal = JSON.parse(localStorage.getItem('p_personal'));
            if(localStorage.getItem('p_skills')) skills = JSON.parse(localStorage.getItem('p_skills'));
            if(localStorage.getItem('p_software')) software = JSON.parse(localStorage.getItem('p_software'));
            if(localStorage.getItem('p_iot')) iot = JSON.parse(localStorage.getItem('p_iot'));
            if(localStorage.getItem('p_photos')) photos = JSON.parse(localStorage.getItem('p_photos'));
            if(localStorage.getItem('p_custom')) customSections = JSON.parse(localStorage.getItem('p_custom'));
        } catch(e) {}

        // ========== RENDER ==========
        function renderHero() {
            document.getElementById('heroContent').innerHTML = `
                <h1 class="hero-title">I'm <span class="highlight">${personal.name}</span><br>Building Digital Experiences</h1>
                <p class="hero-subtitle">${personal.heroSubtitle}</p>
                <div>
                    <a href="#software" class="btn btn-primary"><i class="fas fa-code"></i> Software</a>
                    <a href="#iot" class="btn btn-outline"><i class="fas fa-microchip"></i> IOT</a>
                </div>`;
        }
        function renderAbout() {
            const img = personal.aboutImage ? `<img src="${personal.aboutImage}">` : '<div class="about-image-placeholder"><i class="fas fa-user"></i></div>';
            document.getElementById('aboutContainer').innerHTML = `
                <div class="about-image-wrapper">${img}</div>
                <div>
                    <h3>About <span style="color:var(--electric-blue-light)">Me</span></h3>
                    <p style="color:#aaa;margin:1rem 0;">${personal.aboutText1}</p>
                    <p style="color:#aaa;">${personal.aboutText2}</p>
                    <div style="display:flex;gap:2rem;margin-top:1rem;">
                        <div><span style="font-size:2rem;color:var(--electric-blue-light);font-weight:700;">${software.length+iot.length}+</span><br>Projects</div>
                        <div><span style="font-size:2rem;color:var(--electric-blue-light);font-weight:700;">${photos.length}+</span><br>Photos</div>
                    </div>
                </div>`;
        }
        function renderProjects(gridId, items) {
            document.getElementById(gridId).innerHTML = items.map(p => `
                <div class="project-card">
                    ${p.type==='video' ? `<video src="${p.media}" controls></video>` : `<img src="${p.media}">`}
                    <div class="project-card-body">
                        <span class="project-card-tag">${p.tag}</span>
                        <h3>${p.title}</h3>
                        <p style="color:#888;">${p.desc}</p>
                    </div>
                </div>`).join('');
        }
        function renderPhotos() {
            document.getElementById('photoGrid').innerHTML = photos.map((p,i) => `
                <div class="photo-item" data-index="${i}">
                    <img src="${p.url}">
                </div>`).join('');
        }
        function renderSkills() {
            document.getElementById('skillsGrid').innerHTML = skills.map(s => `
                <div class="skill-card">
                    <div class="skill-icon"><i class="${s.icon}"></i></div>
                    <div>${s.name}</div>
                </div>`).join('');
        }
        function renderFooterSocial() {
            document.getElementById('footerSocial').innerHTML = `
                <a href="${personal.github}" target="_blank"><i class="fab fa-github"></i></a>
                <a href="${personal.discord}" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="${personal.instagram}" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="${personal.linkedin}" target="_blank"><i class="fab fa-linkedin-in"></i></a>`;
        }
        function renderContact() {
            document.getElementById('contactContainer').innerHTML = `
                <form class="contact-form" id="contactForm">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" placeholder="Your Message" required></textarea>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
                <div>
                    <div style="background:var(--card-bg);padding:1rem;border-radius:12px;margin-bottom:1rem;">
                        <i class="fas fa-envelope" style="color:var(--electric-blue-light);"></i> ${personal.email}
                    </div>
                    <div style="background:var(--card-bg);padding:1rem;border-radius:12px;margin-bottom:1rem;">
                        <i class="fas fa-map-marker-alt" style="color:var(--electric-blue-light);"></i> ${personal.location}
                    </div>
                </div>`;
        }
        function refreshAll() {
            renderHero(); renderAbout();
            renderProjects('softwareGrid', software);
            renderProjects('iotGrid', iot);
            renderPhotos(); renderSkills(); renderFooterSocial(); renderContact();
        }
        refreshAll();
        document.getElementById('footerYear').textContent = new Date().getFullYear();

        // Lightbox
        let photoIdx = 0;
        document.getElementById('photoGrid').addEventListener('click', (e) => {
            const item = e.target.closest('.photo-item');
            if(!item) return;
            photoIdx = parseInt(item.dataset.index);
            document.getElementById('lightboxImg').src = photos[photoIdx].url;
            document.getElementById('lightbox').style.display = 'flex';
        });
        document.getElementById('lightboxClose').addEventListener('click', () => {
            document.getElementById('lightbox').style.display = 'none';
        });

        // ========== ADMIN PANEL ==========
        const adminOverlay = document.getElementById('adminOverlay');
        const adminPanel = document.getElementById('adminPanel');
        let loggedIn = false;

        document.getElementById('adminTrigger').addEventListener('click', () => {
            adminOverlay.classList.add('active');
            renderAdmin();
        });

        function closeAdmin() {
            adminOverlay.classList.remove('active');
        }

        function renderAdmin() {
            if(!loggedIn) {
                adminPanel.innerHTML = `
                    <button class="admin-close">&times;</button>
                    <h2><i class="fas fa-lock"></i> Admin Login</h2>
                    <div style="max-width:300px;margin:2rem auto;">
                        <input type="text" id="adminUser" placeholder="Username" style="margin-bottom:1rem;">
                        <input type="password" id="adminPass" placeholder="Password" style="margin-bottom:1rem;">
                        <p id="loginError" style="color:#f44;display:none;">Wrong credentials!</p>
                        <button class="btn btn-primary" id="loginBtn">Login</button>
                    </div>`;
                document.querySelector('.admin-close').addEventListener('click', closeAdmin);
                document.getElementById('loginBtn').addEventListener('click', () => {
                    const user = document.getElementById('adminUser').value;
                    const pass = document.getElementById('adminPass').value;
                    if(user === 'admin' && pass === 'pushpika2024') {
                        loggedIn = true;
                        renderAdmin();
                    } else {
                        document.getElementById('loginError').style.display = 'block';
                    }
                });
            } else {
                adminPanel.innerHTML = `
                    <button class="admin-close">&times;</button>
                    <button id="logoutBtn" style="position:absolute;top:1rem;right:4rem;background:none;border:1px solid #2a2a2a;color:#aaa;padding:0.3rem 1rem;border-radius:20px;cursor:pointer;">Logout</button>
                    <h2><i class="fas fa-sliders-h"></i> Admin Dashboard</h2>
                    <div style="margin-top:1rem;">
                        <!-- Personal Info -->
                        <div class="admin-card">
                            <h3><i class="fas fa-user"></i> Personal Info</h3>
                            <label>Name</label><input id="inpName" value="${personal.name}">
                            <label>Hero Badge</label><input id="inpBadge" value="${personal.heroBadge}">
                            <label>Hero Subtitle</label><input id="inpSubtitle" value="${personal.heroSubtitle}">
                            <label>About Text 1</label><textarea id="inpAbout1">${personal.aboutText1}</textarea>
                            <label>About Text 2</label><textarea id="inpAbout2">${personal.aboutText2}</textarea>
                            <label>About Image URL</label><input id="inpAboutImage" value="${personal.aboutImage||''}">
                            <label>Email</label><input id="inpEmail" value="${personal.email}">
                            <label>GitHub URL</label><input id="inpGithub" value="${personal.github}">
                            <label>Discord URL</label><input id="inpDiscord" value="${personal.discord}">
                            <label>Instagram URL</label><input id="inpInstagram" value="${personal.instagram}">
                            <label>LinkedIn URL</label><input id="inpLinkedin" value="${personal.linkedin}">
                            <button class="btn-sm" id="savePersonal">Save Personal Info</button>
                        </div>
                        <!-- Skills -->
                        <div class="admin-card">
                            <h3><i class="fas fa-tools"></i> Skills</h3>
                            <ul class="admin-list" id="skillsList">${skills.map((s,i) => `<li>${s.name} <button class="delete-btn" data-del-skill="${i}">Remove</button></li>`).join('')}</ul>
                            <input id="newSkillIcon" placeholder="Icon (fas fa-code)">
                            <input id="newSkillName" placeholder="Skill name">
                            <button class="btn-sm" id="addSkill">Add Skill</button>
                        </div>
                        <!-- Software Projects -->
                        <div class="admin-card">
                            <h3><i class="fas fa-code"></i> Software & Web</h3>
                            <ul class="admin-list">${software.map((p,i) => `<li>${p.title} <button class="delete-btn" data-del-sw="${i}">Remove</button></li>`).join('')}</ul>
                            <input id="newSwTitle" placeholder="Title">
                            <select id="newSwType"><option value="image">Image</option><option value="video">Video</option></select>
                            <input id="newSwMedia" placeholder="Media path">
                            <input id="newSwTag" placeholder="Tag">
                            <textarea id="newSwDesc" placeholder="Description"></textarea>
                            <button class="btn-sm" id="addSw">Add Project</button>
                        </div>
                        <!-- IOT Projects -->
                        <div class="admin-card">
                            <h3><i class="fas fa-microchip"></i> IOT & Robotics</h3>
                            <ul class="admin-list">${iot.map((p,i) => `<li>${p.title} <button class="delete-btn" data-del-iot="${i}">Remove</button></li>`).join('')}</ul>
                            <input id="newIotTitle" placeholder="Title">
                            <select id="newIotType"><option value="image">Image</option><option value="video">Video</option></select>
                            <input id="newIotMedia" placeholder="Media path">
                            <input id="newIotTag" placeholder="Tag">
                            <textarea id="newIotDesc" placeholder="Description"></textarea>
                            <button class="btn-sm" id="addIot">Add Project</button>
                        </div>
                        <!-- Photos -->
                        <div class="admin-card">
                            <h3><i class="fas fa-camera"></i> Photos</h3>
                            <ul class="admin-list">${photos.map((p,i) => `<li>${p.caption} <button class="delete-btn" data-del-photo="${i}">Remove</button></li>`).join('')}</ul>
                            <input id="newPhotoUrl" placeholder="Image path">
                            <input id="newPhotoCaption" placeholder="Caption">
                            <button class="btn-sm" id="addPhoto">Add Photo</button>
                        </div>
                    </div>`;
                document.querySelector('.admin-close').addEventListener('click', closeAdmin);
                document.getElementById('logoutBtn').addEventListener('click', () => { loggedIn=false; renderAdmin(); });
                attachEvents();
            }
        }

        function attachEvents() {
            document.getElementById('savePersonal').addEventListener('click', () => {
                personal.name = document.getElementById('inpName').value;
                personal.heroBadge = document.getElementById('inpBadge').value;
                personal.heroSubtitle = document.getElementById('inpSubtitle').value;
                personal.aboutText1 = document.getElementById('inpAbout1').value;
                personal.aboutText2 = document.getElementById('inpAbout2').value;
                personal.aboutImage = document.getElementById('inpAboutImage').value;
                personal.email = document.getElementById('inpEmail').value;
                personal.github = document.getElementById('inpGithub').value;
                personal.discord = document.getElementById('inpDiscord').value;
                personal.instagram = document.getElementById('inpInstagram').value;
                personal.linkedin = document.getElementById('inpLinkedin').value;
